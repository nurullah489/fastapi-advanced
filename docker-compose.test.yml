
services:

  db_test:
    image: postgres:16-alpine
    container_name: fastapi_test_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1%40Dhaka12345
      POSTGRES_DB: fastapi_advanced_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastapi_advanced_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  test:
    build: .
    container_name: fastapi_test_runner
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:1%40Dhaka12345@db_test:5432/fastapi_advanced
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:1%40Dhaka12345@db_test:5432/fastapi_advanced_test
    depends_on:
      db_test:
        condition: service_healthy
    command: ["pytest", "-v", "--tb=short"]
    volumes:
      - .:/app